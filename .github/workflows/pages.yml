# Publica a versão web do Campus no GitHub Pages a cada push na branch principal.
name: Publicar no GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Gerar site (modo demonstração)
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - name: Ajustes para o GitHub Pages
        run: |
          # Rotas do app (ex.: /campus/eventos) abrem direto mesmo ao recarregar a página.
          cp dist/index.html dist/404.html
          # Pastas com "_" (ex.: _expo) não podem ser ignoradas.
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
