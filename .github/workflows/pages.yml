# Publica a versão web do Campus no GitHub Pages a cada push na branch principal.
name: Publicar no GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Com as variáveis do repositório EXPO_PUBLIC_SUPABASE_URL e EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
      # (Settings → Secrets and variables → Actions → Variables), o site usa o Supabase.
      # Sem elas, sai no modo demonstração. São chaves públicas: a segurança vem do RLS.
      - name: Gerar site
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      # Prévia de link (WhatsApp/Instagram), PWA (instalar na tela inicial), 404.html e .nojekyll.
      - name: Ajustes para o GitHub Pages
        run: node scripts/web-postbuild.mjs dist
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
